name: Local transport milestone
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-pipe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Pinned Qt SDK and build tools
        run: |
          python -m pip install -c tools/ci/constraints.txt "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7" "cmake==3.31.6"
          python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 --outputdir build/transport-sdk
      - name: Build Qt-only helper and native non-GUI test
        run: |
          cmake -S tools/local-control -B build/local-transport -A x64 -DQt6_DIR="$env:GITHUB_WORKSPACE/build/transport-sdk/6.11.2/msvc2022_64/lib/cmake/Qt6" -DBUILD_TESTING=ON
          cmake --build build/local-transport --config Release --parallel 2
      - name: Native Windows pipe evidence
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE/build/transport-sdk/6.11.2/msvc2022_64/bin;$env:PATH"
          python tools/local-control/hosted_test.py --build build/local-transport --output build/transport-evidence
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-transport-windows-${{ github.sha }}
          path: |
            build/transport-evidence
            build/local-transport/Testing
            build/local-transport/Release/alloy-local-client.exe
          if-no-files-found: warn
          retention-days: 30
