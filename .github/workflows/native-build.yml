name: Native builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/**, CMakeLists.txt, tools/ci/**, .github/workflows/native-build.yml]
  pull_request:
    paths: [src/**, CMakeLists.txt, tools/ci/**, .github/workflows/native-build.yml]

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  # Let the full native matrix finish; newer pushes replace only a queued candidate.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-arm64, runner: macos-15, python: '3.12.10'}
          - {target: macos-x64, runner: macos-15-intel, python: '3.12.10'}
          - {target: windows-x64, runner: windows-2022, python: '3.12.10'}
          - {target: linux-x64, runner: ubuntu-24.04, python: '3.12.15'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Exact pins must have native archives for each declared platform.
          python-version: ${{ matrix.python }}
      - name: Linux native GL/X11/font headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxext-dev libxmu-dev libxi-dev libxrender-dev libfontconfig1-dev
      - name: Install pinned Qt archive downloader and build tools
        # Released aqt3.3.0 cannot discover Qt6.11 Windows metadata; see research.
        run: python -m pip install -c tools/ci/constraints.txt "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7" "cmake==3.31.6" "ninja==1.11.1.4"
      - name: Build pinned foundations and Alloy
        run: python tools/ci/build.py --target ${{ matrix.target }}
      - name: Retain compile artifacts and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alloy-${{ matrix.target }}-unbundled-${{ github.sha }}
          path: build/ci-artifact
          if-no-files-found: warn
          retention-days: 30
