name: Native builds

on:
  workflow_dispatch:
  push:
    # Compile milestone versions, not every development commit or PR update.
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  # Let an explicitly selected version's full matrix finish.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-arm64, runner: macos-15, python: '3.12.10'}
          - {target: macos-x64, runner: macos-15-intel, python: '3.12.10'}
          - {target: windows-x64, runner: windows-2022, python: '3.12.10'}
          - {target: linux-x64, runner: ubuntu-24.04, python: '3.12.15'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Exact pins must have native archives for each declared platform.
          python-version: ${{ matrix.python }}
      - name: Linux native GL/X11/font headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxext-dev libxmu-dev libxi-dev libxrender-dev libfontconfig1-dev libx11-xcb-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb1-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev libatspi2.0-dev
      - name: Install pinned build tools
        run: python -m pip install -c tools/ci/constraints.txt "cmake==3.31.6" "ninja==1.11.1.4"
      - name: Build pinned foundations and Alloy on macOS/Linux
        if: runner.os != 'Windows'
        run: python tools/ci/build.py --target ${{ matrix.target }}
      - name: Build pinned foundations and Alloy on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" amd64
          python tools\ci\build.py --target ${{ matrix.target }}
      - name: Retain compile artifacts and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alloy-${{ matrix.target }}-unbundled-${{ github.sha }}
          path: build/ci-artifact
          if-no-files-found: warn
          retention-days: 30
